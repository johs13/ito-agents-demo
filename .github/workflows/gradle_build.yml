# =============================================================================
# GitHub Actions - Gradle 빌드 워크플로우
# =============================================================================
# 기존 build.yml(Maven)의 패턴을 따름:
#   - self-hosted Windows 러너 (cmd 셸)
#   - JDK 21 (Zulu)
#   - SonarQube 정적 분석 (SONAR_TOKEN / SONAR_HOST_URL 시크릿 사용)
#
# 참고: Gradle Wrapper(gradlew)가 저장소에 커밋되어 있다면
#       setup-gradle 의 gradle-version 설정은 생략 가능합니다.
#       (Wrapper 미커밋 상태에서도 동작하도록 버전을 지정해 두었습니다)
# =============================================================================

name: Gradle Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  gradle-build:
    name: Gradle Build and analyze
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 분석용 전체 히스토리 필요

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        # Gradle 설치 + 의존성 캐시 자동 처리
        # (wrapper 가 커밋되어 있으면 gradle-version 을 지우면 wrapper 버전을 사용)
        uses: gradle/actions/setup-gradle@v4
        
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          gradle clean build sonar
          -Dsonar.verbose=true
          -Dsonar.projectKey=johs13_ito-agents-demo_eb9065d1-3609-4cb4-8943-c4acd7c15075
          -Dsonar.projectName=ito-agents-demo
          --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-libs
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-results
          path: build/test-results/test/*.xml
          if-no-files-found: ignore