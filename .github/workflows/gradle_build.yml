# =============================================================================
# GitHub Actions - Gradle 빌드 워크플로우
# =============================================================================
# 기존 build.yml(Maven)의 패턴을 따름:
#   - self-hosted Windows 러너 (cmd 셸)
#   - JDK 21 (Zulu)
#   - SonarQube 정적 분석 (SONAR_TOKEN / SONAR_HOST_URL 시크릿 사용)
#
# 참고: 로컬에 설치된 Gradle(C:\gradle-9.7.1)을 절대 경로로 호출합니다.
#       - 기존 build.yml 이 Maven 을 절대 경로로 호출하는 것과 동일한 패턴
#       - self-hosted runner 가 PATH 변경 전에 시작되어 'gradle' 명령을
#         인식하지 못하는 문제를 회피
#       - Gradle Wrapper(gradlew)를 커밋한 후에는 "gradlew.bat" 로 교체 가능
# =============================================================================

name: Gradle Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}

jobs:
  gradle-build:
    name: Gradle Build and analyze
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 분석용 전체 히스토리 필요

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          call "C:\gradle-9.7.1\bin\gradle.bat" clean build sonar
          --stacktrace
          --info
          --warning-mode all
          --no-daemon
          -Dsonar.verbose=true
          -Dsonar.projectKey=johs13_ito-agents-demo_eb9065d1-3609-4cb4-8943-c4acd7c15075
          -Dsonar.projectName=ito-agents-demo
          

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-libs
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-results
          path: build/test-results/test/*.xml
          if-no-files-found: ignore